name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Run tests and build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShomerEinayim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShomerEinayim-apk
          path: ShomerEinayim.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: שומר עיניים – גרסה אחרונה
          prerelease: true
          files: ShomerEinayim.apk
